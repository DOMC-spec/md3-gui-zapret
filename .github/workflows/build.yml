name: Verify Windows alpha candidate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Contract, Guard, both themes and candidate package
        shell: pwsh
        run: ./tools/Build-Candidate.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Zapret-Configurator-win-x64-alpha-${{ github.sha }}
          path: artifacts/candidate-*/
          if-no-files-found: error
