name: Build Windows configurator
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Zapret.sln
      - name: Build
        run: dotnet build Zapret.sln -c Release --no-restore
      - name: Core checks
        run: dotnet run --project tests/Zapret.Core.Tests/Zapret.Core.Tests.csproj -c Release --no-build
      - name: WPF smoke check
        run: dotnet run --project tests/Zapret.Gui.Smoke/Zapret.Gui.Smoke.csproj -c Release --no-build -- artifacts/ui-light.png
      - name: Publish single executable
        run: dotnet publish src/Zapret.Gui/Zapret.Gui.csproj -c Release --no-restore -o artifacts/publish
      - uses: actions/upload-artifact@v4
        with:
          name: Zapret-Configurator-win-x64
          path: artifacts/publish/Zapret.Configurator.exe
